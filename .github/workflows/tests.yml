name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Single-entry matrix on purpose: production runs 8.5, so that is all CI tests.
        # Add 8.6 here when it reaches RC. Do not re-add 8.4 (nothing runs it).
        php-version: ['8.5']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_DB: reel_app_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Install JavaScriptCore for recorder tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libjavascriptcoregtk-4.1-bin || sudo apt-get install -y libjavascriptcoregtk-4.0-bin

      - name: Run Rector
        run: composer rector:check

      - name: Run PHPStan
        run: composer stan

      - name: Run Tests
        run: composer test

      # Blocking, matching how `composer ready` already treats audit locally.
      #
      # Runs last on purpose: an advisory can be published against a dependency at any moment, with
      # no commit here to trigger it, so this step can fail on a PR that changed nothing related.
      # Keeping it after the tests means the test signal is still there when that happens.
      - name: Run Security Audit
        run: |
          composer audit
          composer audit --working-dir=packages/reel-client

  lowest:
    name: lowest (Laravel 13.17.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install JavaScriptCore for recorder tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libjavascriptcoregtk-4.1-bin || sudo apt-get install -y libjavascriptcoregtk-4.0-bin

      - name: Install lowest supported dependencies
        run: |
          composer update --working-dir=packages/reel-client --no-interaction --prefer-dist \
            --with=laravel/framework:13.17.0 \
            --with=orchestra/testbench:11.0.0 \
            --no-blocking \
            --ignore-platform-req=php+

      - name: Show resolved Laravel version
        run: composer show --working-dir=packages/reel-client laravel/framework

      - name: Run client suite
        run: composer test --working-dir=packages/reel-client
